<h1 class="title">Contact ToolVibe</h1><article class="article">
<h2>Feedback and bug reports</h2><p class="notice" id="contact-notice">The support email address has yet to be configured. You can prepare and copy your feedback below.</p>

<label class="field">Subject<input id="contact-subject" maxlength="120" placeholder="Example: Image compressor feedback" required></label>
<label class="field">Message<textarea id="contact-message" rows="6" placeholder="Include the tool, your browser, and the steps to reproduce the issue." required></textarea></label>
<div class="actions"><button type="submit" class="btn">Copy feedback</button><button type="button" class="btn secondary" id="contact-send" hidden>Open email app</button></div><p class="status" id="status" role="status"></p></form></article></main>
