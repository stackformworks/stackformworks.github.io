<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Document Converter | ToolVibe</title>
<style>
  :root{color-scheme:light dark;font:16px/1.55 system-ui,sans-serif}
  body{margin:0;color:#183128;background:#f2f7f3}
  main{width:min(50rem,calc(100% - 2rem));margin:2.5rem auto}
  h1{margin-bottom:.25rem;font-size:clamp(1.75rem,5vw,2.5rem)}
  form,section{display:grid;gap:1rem;background:#fff;border:1px solid #d3e3da;border-radius:1rem;padding:clamp(1rem,3vw,1.5rem);margin-top:1.5rem}
  label{display:grid;gap:.45rem;font-weight:600}
  select,input,button{font:inherit;min-width:0}
  select{padding:.6rem;border-radius:.5rem}
  button,a{font:inherit;font-weight:650;color:white;background:#176548;border:0;border-radius:.5rem;padding:.65rem 1rem;justify-self:start}
  a{text-decoration:none}button:disabled{opacity:.6}
  p{margin:0}[hidden]{display:none!important}
  iframe{width:100%;height:min(65vh,42rem);border:1px solid #d3e3da;border-radius:.5rem}
  [data-error="true"]{color:#a62430}
  @media(prefers-color-scheme:dark){body{background:#0c1813;color:#e6f2ec}form,section{background:#14241c;border-color:#355347}[data-error="true"]{color:#ff9fad}}
</style>
<script defer src="/converter.js"></script>
</head>
<body>
<main>
<h1>ToolVibe Document Converter</h1>
<p>Convert documents on this computer. Files are processed locally and temporary copies are removed after conversion.</p>
<form>
  <label>Convert
    <select id="operation">
      <option value="word-pdf">Word (.docx) to PDF</option>
      <option value="excel-pdf">Excel (.xlsx) to PDF</option>
      <option value="pdf-word">PDF to Word (.docx) · original look</option>
      <option value="pdf-excel">PDF tables to Excel (.xlsx)</option>
    </select>
  </label>
  <p id="mode-note"></p>
  <label>Choose a document<input type="file" id="file" required></label>
  <button type="submit">Convert document</button>
  <p id="status" role="status"></p>
</form>
<section id="result" aria-label="Conversion result" hidden>
  <a id="download">Download converted file</a>
  <iframe id="preview" title="Converted PDF preview" hidden></iframe>
</section>
</main>
</body>
</html>
